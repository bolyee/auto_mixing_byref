<svg xmlns="http://www.w3.org/2000/svg" width="777" height="937" viewBox="0 0 777 937" role="img" aria-labelledby="title desc">
<title id="title">최종 판넬 시스템 처리 흐름</title>
<desc id="desc">입력 보컬과 반주, 레퍼런스 음원을 각각 처리해 최종 음원을 출력하는 시스템 도식</desc>
<defs>
 <marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087F8C"/></marker>
 <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B56524"/></marker>
 <marker id="grayArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8F8F8F"/></marker>
 <style>
  .whitebox{fill:#fff;stroke:#0A1F62;stroke-width:1.35}
  .bluebox{fill:#0A1F62}
  .inputtxt{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#111;text-anchor:middle}
  .demucs{font:700 20px Arial,'Noto Sans KR',sans-serif;fill:#fff}
  .stageTitle{font:700 22px Arial,'Noto Sans KR',sans-serif;fill:#fff;text-anchor:middle}
  .stageText{font:18px Arial,'Noto Sans KR',sans-serif;fill:#fff;text-anchor:middle}
  .outputtxt{font:700 22px Arial,'Noto Sans KR',sans-serif;fill:#111;text-anchor:middle}
  .teal{fill:none;stroke:#087F8C;stroke-width:2.7;marker-end:url(#tealArrow)}
  .orange{fill:none;stroke:#B56524;stroke-width:2.7;marker-end:url(#orangeArrow)}
  .gray{fill:none;stroke:#8F8F8F;stroke-width:2.4;marker-end:url(#grayArrow)}
 </style>
</defs>
<rect width="777" height="937" fill="#fff"/>
<!-- Reference audio -->
<rect class="whitebox" x="209" y="103" width="347" height="52"/>
<text class="inputtxt" x="382.5" y="136">레퍼런스 음원</text>
<!-- Reference vocal separation -->
<rect class="bluebox" x="23" y="190" width="347" height="106"/>
<text class="demucs" x="33" y="246">Demucs 보컬 분리</text>
<!-- Separate user vocal and backing inputs -->
<rect class="whitebox" x="59" y="309" width="355" height="52"/>
<text class="inputtxt" x="236.5" y="342">내 녹음 보컬</text>
<rect class="whitebox" x="422" y="307" width="255" height="52"/>
<text class="inputtxt" x="549.5" y="340">반주(MR)</text>
<!-- Processing stages -->
<rect class="bluebox" x="65" y="393" width="636" height="114"/>
<text class="stageTitle" x="383" y="425">Stage 1: 보컬 최적화</text>
<text class="stageText" x="383" y="454">EQ → Compressor → Reverb</text>
<text class="stageText" x="383" y="478">타깃과 손실 비교 → 경사 분리 역전파</text>
<text class="stageText" x="383" y="501">Adam 50회: EQ·컴프레서 파라미터 갱신</text>
<rect class="bluebox" x="65" y="532" width="636" height="104"/>
<text class="stageTitle" x="383" y="562">Stage 2: 반주 합산</text>
<text class="stageText" x="383" y="593">3초 LUFS 정렬(-2.0 dB) + tanh</text>
<text class="stageText" x="383" y="617">2트랙 믹스다운</text>
<rect class="bluebox" x="65" y="663" width="636" height="123"/>
<text class="stageTitle" x="383" y="694">Stage 3: 마스터링</text>
<text class="stageText" x="383" y="727">레퍼런스 곡의 톤·음압 최적화</text>
<text class="stageText" x="383" y="757">경사 분리: 톤 손실→EQ · 음압 손실→리미터</text>
<!-- Final output -->
<rect class="whitebox" x="209" y="807" width="347" height="52"/>
<text class="outputtxt" x="382.5" y="840">최종 음원 출력</text>
<!-- Arrows follow the final panel topology: Demucs and vocal into Stage 1, MR into Stage 2, reference into Stage 3 -->
<path class="teal" d="M260 157L187 183"/>
<path class="orange" d="M505 157L745 294"/>
<path class="orange" d="M745 296V728"/>
<path class="orange" d="M745 728H703"/>
<path class="teal" d="M28 296V434H65"/>
<path class="gray" d="M241 365V393"/>
<path class="orange" d="M678 334H724V584H703"/>
<path class="gray" d="M383 510V529"/>
<path class="gray" d="M383 640V659"/>
<path class="gray" d="M383 789V807"/>
</svg>